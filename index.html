<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSME Project Report Generator</title>
<style>
:root{
  --navy:#173a5e;
  --navy-dark:#0f2740;
  --gold:#c9922e;
  --gold-dark:#a5751d;
  --cream:#f6f4ef;
  --paper:#ffffff;
  --ink:#1c2530;
  --ink-soft:#5b6572;
  --line:#dcd6c9;
  --green:#2f7a4f;
  --red:#b3402f;
  --amber:#b3841f;
  --radius:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--cream);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
}
.app{max-width:960px;margin:0 auto;padding:0 0 60px;}
header.topbar{
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);
  color:#fff;padding:14px 18px;position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
header.topbar .brand{display:flex;flex-direction:column;}
header.topbar .brand b{font-size:16px;letter-spacing:.2px;}
header.topbar .brand span{font-size:11px;color:#cfd9e6;}
header.topbar button.nav-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;
  padding:7px 12px;border-radius:var(--radius);font-size:13px;cursor:pointer;
}
header.topbar button.nav-btn:active{background:rgba(255,255,255,.2);}
main{padding:16px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card h2{margin:0 0 4px;font-size:18px;color:var(--navy);}
.card h3{margin:18px 0 8px;font-size:15px;color:var(--navy-dark);border-bottom:1px solid var(--line);padding-bottom:6px;}
.muted{color:var(--ink-soft);font-size:13px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.grid{grid-template-columns:1fr;}}
label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;margin-top:10px;font-weight:600;}
input[type=text],input[type=number],input[type=tel],select,textarea{
  width:100%;padding:9px 10px;border:1px solid #c7c0ac;border-radius:var(--radius);font-size:15px;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
button.btn{
  background:var(--navy);color:#fff;border:none;padding:11px 18px;border-radius:var(--radius);
  font-size:14.5px;cursor:pointer;font-weight:600;
}
button.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);}
button.btn.gold{background:var(--gold);color:#fff;}
button.btn.danger{background:#fff;color:var(--red);border:1px solid var(--red);}
button.btn:disabled{opacity:.45;cursor:not-allowed;}
button.btn:active{transform:translateY(1px);}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.pill{padding:7px 13px;border-radius:20px;border:1px solid #c7c0ac;background:#fff;cursor:pointer;font-size:13.5px;}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0;}
table th,table td{border:1px solid var(--line);padding:7px 8px;text-align:right;}
table th:first-child,table td:first-child{text-align:left;}
table th{background:#eee8d8;color:var(--navy-dark);font-weight:700;}
table tr.total td{font-weight:700;background:#f3efe2;}
.progressbar{display:flex;gap:4px;margin-bottom:16px;}
.progressbar div{flex:1;height:6px;border-radius:3px;background:#e3dcc9;}
.progressbar div.done{background:var(--gold);}
.progressbar div.current{background:var(--navy);}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
.badge.default{background:#e4eee7;color:var(--green);}
.badge.modified{background:#fbe9d8;color:var(--gold-dark);}
.check-list{list-style:none;padding:0;margin:8px 0;}
.check-list li{padding:5px 0;font-size:14px;display:flex;gap:8px;align-items:flex-start;}
.check-list li.pass:before{content:"✓";color:var(--green);font-weight:900;}
.check-list li.fail:before{content:"✗";color:var(--red);font-weight:900;}
.check-list li.warn:before{content:"!";color:var(--amber);font-weight:900;}
.proj-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;}
.proj-item .meta b{display:block;}
.proj-item .meta span{font-size:12px;color:var(--ink-soft);}
.proj-actions{display:flex;gap:6px;flex-wrap:wrap;}
.proj-actions button{padding:6px 9px;font-size:12px;}
.demo-tag{background:var(--red);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;}
.assump-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line);padding:7px 0;font-size:14px;}
.assump-row .val{display:flex;align-items:center;gap:8px;}
.how-calc{font-size:11.5px;color:var(--navy);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;margin-left:6px;}
.how-calc-box{background:#f2eee0;border:1px dashed var(--gold-dark);border-radius:4px;padding:8px 10px;font-size:12.5px;margin:6px 0;color:var(--ink-soft);}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;}
.tabs button{white-space:nowrap;padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.report-page{background:#fff;}
.report-cover{text-align:center;padding:50px 10px;border:2px solid var(--navy);border-radius:8px;}
.report-cover h1{color:var(--navy);font-size:22px;margin-bottom:4px;}
.report-cover .sub{color:var(--ink-soft);margin-bottom:30px;}
.footer-byline{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:30px;padding-top:14px;border-top:1px solid var(--line);}
.note-box{background:#fdf6e8;border-left:4px solid var(--gold);padding:10px 12px;font-size:13px;margin:10px 0;border-radius:0 4px 4px 0;}
.warn-box{background:#fdeceb;border-left:4px solid var(--red);padding:10px 12px;font-size:13px;margin:10px 0;border-radius:0 4px 4px 0;}
.section-anchor{scroll-margin-top:70px;}
.hidden{display:none !important;}
.small{font-size:12px;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.searchbox{position:relative;}
.activity-list{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius);}
.activity-list .act-cat{background:#eee8d8;padding:5px 10px;font-weight:700;font-size:12px;color:var(--navy-dark);position:sticky;top:0;}
.activity-list .act-item{padding:8px 10px;border-bottom:1px solid #efece0;cursor:pointer;font-size:14px;}
.activity-list .act-item:hover, .activity-list .act-item.sel{background:#f3efe2;}
.two-col-inline{display:flex;gap:8px;align-items:center;}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-top:8px;}
@media print{
  header.topbar,.no-print{display:none !important;}
  body{background:#fff;font-size:12px;}
  .app{max-width:100%;}
  .card{border:none;box-shadow:none;padding:0;margin-bottom:14px;page-break-inside:avoid;}
  .report-page{padding:0;}
  table{font-size:11px;}
  .section-anchor{page-break-before:auto;}
}

/* ---------------- Formatting ---------------- */
function inr(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  n = Math.round(n);
  const neg = n<0; n = Math.abs(n);
  let s = n.toString();
  let last3 = s.substring(s.length-3);
  let other = s.substring(0,s.length-3);
  if(other!=='') last3 = ','+last3;
  let formatted = other.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + last3;
  return (neg?'-':'') + '₹' + formatted;
}
function pct(n,dp){ if(n===null||n===undefined||isNaN(n)) return "—"; return (Math.round(n*Math.pow(10,dp||1))/Math.pow(10,dp||1))+"%"; }
function num(n){ return (n===null||n===undefined||isNaN(n))?0:n; }
function daysFmt(n){ return n+" days"; }

/* ============================================================
   CALCULATION ENGINE
   ============================================================ */
function getAssumptions(p){
  const base = MODELS[p.activityModel] || MODELS.fastMovingRetail;
  const a = Object.assign({}, base);
  if(p.assumptions){ Object.assign(a, p.assumptions); }
  return a;
}
function isModified(p, key){
  const base = MODELS[p.activityModel] || MODELS.fastMovingRetail;
  if(!p.assumptions || p.assumptions[key]===undefined) return false;
  return Number(p.assumptions[key]) !== Number(base[key]);
}
function getSalesSeries(p){
  if(p.sales.mode==='growth'){
    const c = num(p.sales.currentSales), g = num(p.sales.growthPct)/100;
    const y1 = c*(1+g), y2=y1*(1+g), y3=y2*(1+g);
    return [y1,y2,y3];
  }
  return [num(p.sales.y1), num(p.sales.y2), num(p.sales.y3)];
}

function calculate(p){
  const a = getAssumptions(p);
  const s = p.settings;
  const sales = getSalesSeries(p);
  const years = [1,2,3];

  // ---- P&L ----
  const pnl = years.map((yr,i)=>{
    const S = sales[i];
    const cos = S*a.costOfSales/100;
    const gp = S-cos;
    const employee = S*a.employee/100, rent=S*a.rent/100, elec=S*a.electricity/100,
      transport=S*a.transport/100, admin=S*a.admin/100, selling=S*a.selling/100,
      repairs=S*a.repairs/100, other=S*a.otherOpex/100;
    const totalOpex = employee+rent+elec+transport+admin+selling+repairs+other;
    const ebitda = gp-totalOpex;
    return {sales:S,cos,gp,employee,rent,elec,transport,admin,selling,repairs,other,totalOpex,ebitda};
  });

  // ---- Project cost & means of finance ----
  const termLoan = num(p.loan.termLoan) || num(p.loan.total);
  const fixedAssetReq = s.promoterMarginFixedPct<100 ? termLoan/(1-s.promoterMarginFixedPct/100) : termLoan;
  const promoterMarginFixed = fixedAssetReq - termLoan;
  const split = s.fixedAssetSplit;
  const fa = {
    land: fixedAssetReq*split.land/100, building: fixedAssetReq*split.building/100,
    machinery: fixedAssetReq*split.machinery/100, furniture: fixedAssetReq*split.furniture/100,
    vehicle: fixedAssetReq*split.vehicle/100, preliminary: fixedAssetReq*split.preliminary/100,
    other: fixedAssetReq*split.other/100
  };
  const grossBlock = fixedAssetReq - fa.land; // land not depreciated

  const y1Sales = sales[0];
  const wcReq = y1Sales*s.wcTurnoverPct/100;
  const wcNwc = y1Sales*s.wcNwcPct/100;
  const wcBank = y1Sales*s.wcBankPct/100;

  const totalProjectCost = fixedAssetReq + wcReq;
  const promoterContributionTotal = promoterMarginFixed + wcNwc;
  const meansOfFinance = {
    promoterContribution: promoterContributionTotal, termLoan: termLoan,
    wcFinance: wcBank, otherSources:0, subsidy:0,
    total: promoterContributionTotal+termLoan+wcBank
  };

  // ---- Operating cycle method (per year) ----
  const opCycle = pnl.map((row,i)=>{
    const S = sales[i];
    const inventory = row.cos*a.stockDays/365;
    const receivables = S*a.debtorDays/365;
    const otherCA = S*s.otherCurrentAssetsPct/100;
    const creditors = row.cos*a.creditorDays/365;
    const otherCL = S*s.otherCurrentLiabPct/100;
    const gap = (inventory+receivables+otherCA) - (creditors+otherCL);
    const borrowerContribution = gap*(s.wcNwcPct/s.wcTurnoverPct);
    const bankFinance = gap - borrowerContribution;
    return {inventory,receivables,otherCA,creditors,otherCL,gap,borrowerContribution,bankFinance};
  });

  // ---- Loan repayment schedule (Term Loan, equal principal, monthly) ----
  const tenureMonths = Math.round(s?.tenureYears ? p.loanTerms.tenureYears*12 : p.loanTerms.tenureYears*12) || (p.loanTerms.tenureYears*12);
  const moraMonths = num(p.loanTerms.moratoriumMonths);
  const rate = num(p.loanTerms.interestRatePct)/100/12;
  const repayMonths = Math.max(tenureMonths - moraMonths,1);
  const monthlyPrincipal = termLoan>0 ? termLoan/repayMonths : 0;
  let schedule = [];
  let bal = termLoan;
  for(let m=1;m<=tenureMonths;m++){
    const openBal = bal;
    const interest = openBal*rate;
    let principal = 0;
    if(m>moraMonths){ principal = Math.min(monthlyPrincipal, bal); }
    bal = bal - principal;
    schedule.push({month:m, open:openBal, interest, principal, close:bal, inMoratorium: m<=moraMonths});
  }
  // annualize into 3 yearly buckets (12 months each)
  function yearBucket(yr){
    const from=(yr-1)*12+1, to=yr*12;
    const rows = schedule.filter(r=>r.month>=from && r.month<=to);
    const openBal = rows.length? rows[0].open : (yr===1?termLoan:0);
    const closeBal = rows.length? rows[rows.length-1].close : 0;
    const interest = rows.reduce((t,r)=>t+r.interest,0);
    const principal = rows.reduce((t,r)=>t+r.principal,0);
    return {openBal,closeBal,interest,principal};
  }
  const tlYearly = [1,2,3].map(yearBucket);

  // WC interest per year (utilised = year's assessed bank finance under turnover method, revolving)
  const wcYearly = sales.map(S=> S*s.wcBankPct/100);
  const wcInterestYearly = wcYearly.map(w=> w*num(p.loanTerms.interestRatePct)/100);

  // ---- Depreciation (WDV) per year ----
  let wdv = grossBlock;
  const deprYearly = [];
  for(let i=0;i<3;i++){
    const d = wdv*a.deprRate/100;
    deprYearly.push(d);
    wdv = wdv-d;
  }

  // ---- Full P&L with interest, depreciation, tax ----
  const pnlFull = pnl.map((row,i)=>{
    const depr = deprYearly[i];
    const interest = tlYearly[i].interest + wcInterestYearly[i];
    const pbt = row.ebitda - depr - interest;
    const tax = pbt>0 ? pbt*s.taxRatePct/100 : 0;
    const pat = pbt-tax;
    return Object.assign({}, row, {depr, interest, pbt, tax, pat, termInterest:tlYearly[i].interest, wcInterest:wcInterestYearly[i]});
  });

  // ---- Owner drawings & retained earnings ----
  let cumRE = 0;
  const drawingsYearly = pnlFull.map(r=> Math.max(r.pat,0)*s.ownerDrawingsPct/100);
  const reYearly = pnlFull.map((r,i)=>{ cumRE += (r.pat - drawingsYearly[i]); return cumRE; });

  // ---- Net Fixed Assets per year ----
  let nfaOpen = grossBlock;
  const nfaYearly = [];
  for(let i=0;i<3;i++){
    const close = (i===0?grossBlock:nfaYearly[i-1].close) - deprYearly[i];
    nfaYearly.push({open:(i===0?grossBlock:nfaYearly[i-1].close), close});
  }

  // ---- Cash flow (indirect) ----
  let cash = num(p.openingCash);
  const cashFlow = [];
  for(let i=0;i<3;i++){
    const opChgInv = i===0 ? opCycle[0].inventory : (opCycle[i].inventory-opCycle[i-1].inventory);
    const opChgRec = i===0 ? opCycle[0].receivables : (opCycle[i].receivables-opCycle[i-1].receivables);
    const opChgOCA = i===0 ? opCycle[0].otherCA : (opCycle[i].otherCA-opCycle[i-1].otherCA);
    const opChgCred = i===0 ? opCycle[0].creditors : (opCycle[i].creditors-opCycle[i-1].creditors);
    const opChgOCL = i===0 ? opCycle[0].otherCL : (opCycle[i].otherCL-opCycle[i-1].otherCL);
    const operating = pnlFull[i].pat + deprYearly[i] - (opChgInv+opChgRec+opChgOCA) + (opChgCred+opChgOCL);
    const investing = i===0 ? -(fixedAssetReq) : 0;
    const termLoanDisb = i===0 ? termLoan : 0;
    const termPrincipalRepaid = -tlYearly[i].principal;
    const promoterInfusion = i===0 ? promoterContributionTotal : 0;
    const wcChg = i===0 ? wcYearly[0] : (wcYearly[i]-wcYearly[i-1]);
    const drawings = -drawingsYearly[i];
    const financing = termLoanDisb+termPrincipalRepaid+promoterInfusion+wcChg+drawings;
    const net = operating+investing+financing;
    const closing = cash+net;
    cashFlow.push({operating,investing,financing,net,opening:cash,closing,
      termLoanDisb,termPrincipalRepaid,promoterInfusion,wcChg,drawings,
      opChgInv,opChgRec,opChgOCA,opChgCred,opChgOCL});
    cash = closing;
  }

  // ---- Balance Sheet ----
  const balanceSheet = [0,1,2].map(i=>{
    const assets = {
      nfa: nfaYearly[i].close, inventory: opCycle[i].inventory, receivables: opCycle[i].receivables,
      cash: cashFlow[i].closing, otherCA: opCycle[i].otherCA
    };
    assets.total = assets.nfa+assets.inventory+assets.receivables+assets.cash+assets.otherCA;
    const promoterCapital = promoterContributionTotal;
    const liabilities = {
      promoterCapital, retainedEarnings: reYearly[i], termLoan: tlYearly[i].closeBal,
      wcBorrowing: wcYearly[i], creditors: opCycle[i].creditors, otherCL: opCycle[i].otherCL
    };
    liabilities.total = promoterCapital+reYearly[i]+tlYearly[i].closeBal+wcYearly[i]+opCycle[i].creditors+opCycle[i].otherCL;
    return {assets, liabilities, diff: assets.total-liabilities.total};
  });

  // ---- DSCR ----
  const dscrYearly = pnlFull.map((r,i)=>{
    const cashAccrual = r.pat + r.depr;
    const debtService = r.termInterest + tlYearly[i].principal;
    const dscr = debtService>0 ? (cashAccrual+r.termInterest)/(debtService) : null;
    return {cashAccrual, interest:r.termInterest, principal:tlYearly[i].principal, debtService, dscr};
  });
  const validDscr = dscrYearly.filter(d=>d.dscr!==null).map(d=>d.dscr);
  const avgDscr = validDscr.length? validDscr.reduce((a,b)=>a+b,0)/validDscr.length : null;
  const minDscr = validDscr.length? Math.min(...validDscr) : null;

  // ---- Ratios ----
  const ratios = [0,1,2].map(i=>{
    const bs = balanceSheet[i], r = pnlFull[i];
    const ca = bs.assets.inventory+bs.assets.receivables+bs.assets.cash+bs.assets.otherCA;
    const cl = bs.liabilities.wcBorrowing+bs.liabilities.creditors+bs.liabilities.otherCL;
    const currentRatio = cl>0? ca/cl : null;
    const tnw = bs.liabilities.promoterCapital+bs.liabilities.retainedEarnings;
    const totalDebt = bs.liabilities.termLoan+bs.liabilities.wcBorrowing;
    const tol = totalDebt+bs.liabilities.creditors+bs.liabilities.otherCL;
    const debtEquity = tnw>0? totalDebt/tnw : null;
    const tolTnw = tnw>0? tol/tnw : null;
    const gpMargin = r.sales>0? (r.gp/r.sales)*100 : null;
    const ebitdaMargin = r.sales>0? (r.ebitda/r.sales)*100 : null;
    const npMargin = r.sales>0? (r.pat/r.sales)*100 : null;
    const interestCoverage = r.interest>0? r.ebitda/r.interest : null;
    return {currentRatio,debtEquity,tolTnw,gpMargin,ebitdaMargin,npMargin,interestCoverage,
      stockDays:a.stockDays, debtorDays:a.debtorDays, creditorDays:a.creditorDays,
      wcCycle:a.stockDays+a.debtorDays-a.creditorDays};
  });

  // ---- Break-even ----
  const breakeven = pnlFull.map((r,i)=>{
    const S = sales[i];
    const variable = r.cos + r.transport + r.selling;
    const fixed = r.employee+r.rent+r.elec+r.admin+r.repairs+r.other+r.depr+r.interest;
    const contribution = S-variable;
    const pvRatio = S>0? contribution/S : 0;
    const beSales = pvRatio>0 ? fixed/pvRatio : null;
    const bePct = (beSales!==null && S>0) ? (beSales/S)*100 : null;
    return {fixed,variable,contribution,pvRatio:pvRatio*100,beSales,bePct};
  });

  // ---- Validation checklist ----
  const checklist = [];
  checklist.push({label:"Borrower & Activity Details", pass: !!(p.borrower.name && p.activityModel)});
  checklist.push({label:"Sales Projection Entered", pass: sales.every(v=>v>0)});
  checklist.push({label:"Assumptions Reviewed", pass:true});
  checklist.push({label:"Project Cost = Means of Finance", pass: Math.abs(totalProjectCost-meansOfFinance.total)<1});
  checklist.push({label:"Working Capital Calculated", pass: wcReq>0});
  checklist.push({label:"Profit & Loss Calculated", pass: pnlFull.every(r=>!isNaN(r.pat))});
  checklist.push({label:"Balance Sheet Balanced", pass: balanceSheet.every(b=>Math.abs(b.diff)<2)});
  checklist.push({label:"Cash Flow Calculated", pass: cashFlow.every(c=>!isNaN(c.closing))});
  checklist.push({label:"Repayment Schedule Calculated", pass: termLoan>=0});
  checklist.push({label:"Ratios Calculated", pass: ratios.every(r=>r!==null)});
  const allPass = checklist.every(c=>c.pass);
  checklist.push({label:"Report Ready", pass: allPass});

  return {
    a, sales, pnl:pnlFull, fixedAssetReq, promoterMarginFixed, fa, grossBlock,
    wcReq, wcNwc, wcBank, totalProjectCost, meansOfFinance, opCycle,
    schedule, tlYearly, wcYearly, wcInterestYearly, deprYearly, nfaYearly,
    drawingsYearly, reYearly, cashFlow, balanceSheet, dscrYearly, avgDscr, minDscr,
    ratios, breakeven, checklist, termLoan, tenureMonths, moraMonths
  };
}

/* ============================================================
   RENDERING — DASHBOARD
   ============================================================ */
function goDashboard(){
  wizardStep=1; current=null;
  document.getElementById('saveTopBtn').style.display='none';
  document.getElementById('topbarSub').textContent = "Offline • v"+APP_VERSION;
  renderDashboard();
}
function renderDashboard(){
  const projects = loadAllProjects();
  let html = `<div class="card">
    <h2>MSME Project Report Generator</h2>
    <p class="muted">Ask less. Calculate more. Show assumptions. Explain clearly.<br>
    Enter Borrower Details, Activity, Loan Requirement and Sales Projection — the rest is calculated automatically using transparent, editable assumptions.</p>
    <div class="btnrow">
      <button class="btn gold" onclick="startNewProject()">+ New Project</button>
      <button class="btn secondary" onclick="loadSampleProjects()">Load Sample Projects</button>
      <button class="btn secondary" onclick="document.getElementById('importFile').click()">Import Project</button>
      <button class="btn secondary" onclick="openSettingsScreen()">Settings / Default Assumptions</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImportFile(event)">
    </div>
  </div>`;

  html += `<div class="card"><h3>Saved Projects (${projects.length})</h3>`;
  if(projects.length===0){
    html += `<p class="muted">No saved projects yet. Start a new project or load sample projects to explore the app.</p>`;
  } else {
    projects.slice().reverse().forEach(pr=>{
      html += `<div class="proj-item">
        <div class="meta">
          <b>${escapeHtml(pr.borrower.business||pr.borrower.name||"Untitled Project")} ${pr.isDemo?'<span class="demo-tag">DEMO DATA</span>':''}</b>
          <span>${escapeHtml(pr.activityName||'')} • Loan ₹${inr(pr.loan.total).replace('₹','')} • ${new Date(pr.createdAt).toLocaleDateString('en-IN')}</span>
        </div>
        <div class="proj-actions">
          <button class="btn secondary" onclick="openProject('${pr.id}')">Open</button>
          <button class="btn secondary" onclick="duplicateProject('${pr.id}')">Duplicate</button>
          <button class="btn secondary" onclick="exportProject('${pr.id}')">Export</button>
          <button class="btn danger" onclick="deleteProjectConfirm('${pr.id}')">Delete</button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  html += `<div class="card small muted">Version ${APP_VERSION} — 100% offline. Data stays only on this device (browser storage). Developed by Anil Sharma, Former General Manager, Central Bank of India.</div>`;
  document.getElementById('mainArea').innerHTML = html;
}
function escapeHtml(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function startNewProject(){ current = blankProject(); wizardStep=1; renderWizard(); }
function openProject(id){
  const pr = loadAllProjects().find(x=>x.id===id);
  if(!pr) return;
  current = pr; wizardStep=1;
  document.getElementById('saveTopBtn').style.display='inline-block';
  renderWizard();
}
function duplicateProject(id){
  const list = loadAllProjects();
  const pr = list.find(x=>x.id===id);
  if(!pr) return;
  const copy = JSON.parse(JSON.stringify(pr));
  copy.id = uid(); copy.createdAt = new Date().toISOString();
  copy.borrower.business = (copy.borrower.business||"Project")+" (Copy)";
  list.push(copy); persistAllProjects(list); renderDashboard();
}
function deleteProjectConfirm(id){
  if(!confirm("Delete this project permanently from this device?")) return;
  let list = loadAllProjects().filter(x=>x.id!==id);
  persistAllProjects(list); renderDashboard();
}
function exportProject(id){
  const pr = loadAllProjects().find(x=>x.id===id);
  if(!pr) return;
  const blob = new Blob([JSON.stringify(pr,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = (pr.borrower.business||"msme-project").replace(/\s+/g,'_')+".json";
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}
function handleImportFile(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const pr = JSON.parse(e.target.result);
      pr.id = uid(); pr.createdAt = new Date().toISOString();
      const list = loadAllProjects(); list.push(pr); persistAllProjects(list);
      renderDashboard();
    }catch(err){ alert("Could not read this file. Please select a valid exported project JSON file."); }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

/* ---------------- Sample Projects ---------------- */
function loadSampleProjects(){
  const samples = buildSampleProjects();
  const list = loadAllProjects();
  const existingDemoNames = new Set(list.filter(p=>p.isDemo).map(p=>p.borrower.business));
  let added=0;
  samples.forEach(sp=>{
    if(!existingDemoNames.has(sp.borrower.business)){ list.push(sp); added++; }
  });
  persistAllProjects(list);
  alert(added+" sample project(s) added (labelled DEMO DATA – NOT FOR BANK SUBMISSION).");
  renderDashboard();
}

const WIZARD_TITLES = ["Borrower Details","Business Activity","Loan Requirement","Sales Projection","Loan Terms"];
function renderWizard(){
  document.getElementById('saveTopBtn').style.display='inline-block';
  document.getElementById('topbarSub').textContent = (current.borrower.business||"New Project")+" • Step "+wizardStep+" of 5";
  let bars = "";
  for(let i=1;i<=5;i++){ bars += `<div class="${i<wizardStep?'done':(i===wizardStep?'current':'')}"></div>`; }
  let body = "";
  if(wizardStep===1) body = stepBorrower();
  else if(wizardStep===2) body = stepActivity();
  else if(wizardStep===3) body = stepLoan();
  else if(wizardStep===4) body = stepSales();
  else if(wizardStep===5) body = stepLoanTerms();

  const html = `<div class="card">
    <h2>${WIZARD_TITLES[wizardStep-1]}</h2>
    <div class="progressbar">${bars}</div>
    ${body}
    <div class="btnrow">
      ${wizardStep>1?`<button class="btn secondary" onclick="wizardBack()">Back</button>`:`<button class="btn secondary" onclick="goDashboard()">Cancel</button>`}
      ${wizardStep<5?`<button class="btn gold" onclick="wizardNext()">Next</button>`:`<button class="btn gold" onclick="goToAssumptions()">Review Assumptions</button>`}
    </div>
  </div>`;
  document.getElementById('mainArea').innerHTML = html;
}
function stepBorrower(){
  const b = current.borrower;

    <div><label>Business Name *</label><input type="text" id="w_business" value="${escapeHtml(b.business)}"></div>
    <div><label>Constitution</label><select id="w_constitution">
      ${["Proprietorship","Partnership","SHG/JLG","Private Limited","LLP","Other"].map(o=>`<option ${b.constitution===o?'selected':''}>${o}</option>`).join('')}
    </select></div>
    <div><label>Mobile</label><input type="tel" id="w_mobile" value="${escapeHtml(b.mobile)}"></div>
    <div style="grid-column:1/-1;"><label>Address</label><textarea id="w_address" rows="2">${escapeHtml(b.address)}</textarea></div>
    <div><label>Business Status</label><select id="w_existing">
      <option ${b.existing==='New'?'selected':''}>New</option><option ${b.existing==='Existing'?'selected':''}>Existing</option>
    </select></div>
    <div><label>Business Experience</label><input type="text" id="w_experience" placeholder="e.g. 3 years" value="${escapeHtml(b.experience)}"></div>
    <div><label>Udyam Registration (if available)</label><input type="text" id="w_udyam" value="${escapeHtml(b.udyam)}"></div>
    <div><label>GSTIN (if applicable)</label><input type="text" id="w_gstin" value="${escapeHtml(b.gstin)}"></div>

function stepActivity(){
  const cats = ["Trading","Manufacturing","Services"];
  let catPills = cats.map(c=>`<div class="pill ${current.activityCategory===c?'active':''}" onclick="selectActivityCategory('${c}')">${c}</div>`).join('');
  let listHtml = '';
  if(current.activityCategory){
    const items = ACTIVITIES.filter(a=>a[0]===current.activityCategory);
    listHtml = `<div class="searchbox"><input type="text" id="actSearch" placeholder="Search activity..." oninput="filterActivityList()"></div>
      <div class="activity-list" id="actList">${items.map(a=>`<div class="act-item ${current.activityName===a[1]?'sel':''}" data-name="${escapeHtml(a[1])}" onclick="selectActivity('${escapeHtml(a[1]).replace(/'/g,"\\'")}','${a[2]}')">${escapeHtml(a[1])}</div>`).join('')}</div>
      <div class="chk"><input type="checkbox" id="w_customAct" ${current.customActivity?'checked':''} onchange="toggleCustomActivity()"> My activity is not listed — enter manually and pick the nearest financial model</div>

  }
  return `<div class="pillrow">${catPills}</div>${listHtml}

function selectActivity(name, model){ current.activityName=name; current.activityModel=model; current.customActivity=false; renderWizard(); }
function toggleCustomActivity(){ current.customActivity = document.getElementById('w_customAct').checked; renderWizard(); }
function filterActivityList(){

function stepSales(){
  const s = current.sales;

function setSalesMode(m){ current.sales.mode=m; renderWizard(); }
function stepLoanTerms(){
  const t = current.loanTerms;
  return `<div class="grid">
    <div><label>Interest Rate (% p.a.)</label><input type="number" id="w_rate" value="${t.interestRatePct}"></div>

function wizardBack(){ persistWizardStep(); wizardStep--; renderWizard(); }
function wizardNext(){
  if(wizardStep===1 && (!val('w_name') || !val('w_business'))){ alert("Please enter Borrower Name and Business Name."); return; }
  if(wizardStep===2 && !current.customActivity && !current.activityModel){ alert("Please select a business activity."); return; }
  persistWizardStep();
  if(wizardStep===2 && current.customActivity){
    const nm = val('w_customActName'); if(!nm){ alert("Please enter the activity name."); return; }
    current.activityName = nm; current.activityModel = val('w_customModel');
  }
  if(wizardStep===3 && !val('w_loanTotal')){ alert("Please enter the total loan required."); return; }
  wizardStep++; renderWizard();
}
function persistWizardStep(){
  if(wizardStep===1){
    current.borrower = { name:val('w_name'), business:val('w_business'), constitution:val('w_constitution'),
      address:val('w_address'), mobile:val('w_mobile'), existing:val('w_existing'), experience:val('w_experience'),
      udyam:val('w_udyam'), gstin:val('w_gstin'), bank:val('w_bank') };
  } else if(wizardStep===2){
    if(current.customActivity){ current.activityName = val('w_customActName'); current.activityModel = val('w_customModel'); }
  } else if(wizardStep===3){
    current.loan = { total:+val('w_loanTotal')||0, purpose:val('w_purpose'), termLoan:+val('w_termLoan')||0, wcLoan:+val('w_wcLoan')||0 };
    if(!current.loan.termLoan && !current.loan.wcLoan){ current.loan.termLoan = current.loan.total; }
  } else if(wizardStep===4){
    if(current.sales.mode==='direct'){
      current.sales.y1=+val('w_y1')||0; current.sales.y2=+val('w_y2')||0; current.sales.y3=+val('w_y3')||0;
    } else {
      current.sales.currentSales=+val('w_currentSales')||0; current.sales.growthPct=+val('w_growth')||0;
    }
  } else if(wizardStep===5){
    current.loanTerms = { interestRatePct:+val('w_rate')||0, tenureYears:+val('w_tenure')||1, moratoriumMonths:+val('w_mora')||0, instalmentFreq:val('w_freq') };
  }
}

  return `<h3>Projected Sales</h3><table><tr><th>Year</th><th>Projected Sales</th></tr>

function rPnl(c){

function rBS(c){

  <table><tr><th>Assets</th><th>Yr 1</th><th>Yr 2</th><th>Yr 3</th></tr>

  <table><tr><th>Liabilities</th><th>Yr 1</th><th>Yr 2</th><th>Yr 3</th></tr>
  ${liab.map(([label,g,k])=>`<tr class="${k==='total'?'total':''}"><td>${label}</td><td>${inr(c.balanceSheet[0][g][k])}</td><td>${inr(c.balanceSheet[1][g][k])}</td><td>${inr(c.balanceSheet[2][g][k])}</td></tr>`).join('')}

function rCF(c){

  <tr><td>Cash from Operating Activities</td><td>${inr(c.cashFlow[0].operating)}</td><td>${inr(c.cashFlow[1].operating)}</td><td>${inr(c.cashFlow[2].operating)}</td></tr>

  <tr class="total"><td>Net Cash Flow</td><td>${inr(c.cashFlow[0].net)}</td><td>${inr(c.cashFlow[1].net)}</td><td>${inr(c.cashFlow[2].net)}</td></tr>

}
function rWC(c){

  <tr><td>Working Capital Requirement</td><td>${inr(c.wcReq)}</td><td>${inr(c.opCycle[0].gap)}</td></tr>
  <tr><td>Borrower's Contribution</td><td>${inr(c.wcNwc)}</td><td>${inr(c.opCycle[0].borrowerContribution)}</td></tr>

}
function rMPBF(c){
  const s = current.settings;
  return `<h3>Working Capital – Turnover Method (Nayak Method)</h3>
  <p>Formula: Working Capital Requirement = ${s.wcTurnoverPct}% of Projected Annual Turnover; Borrower's NWC/Margin = ${s.wcNwcPct}% of Turnover; Bank Finance = ${s.wcBankPct}% of Turnover.</p>
  <table><tr><th></th><th>Amount</th></tr>
  <tr><td>Projected Annual Turnover (Current Year)</td><td>${inr(c.sales[0])}</td></tr>
  <tr><td>Working Capital Requirement (${s.wcTurnoverPct}%)</td><td>${inr(c.wcReq)}</td></tr>
  <tr><td>Borrower's NWC / Margin (${s.wcNwcPct}%)</td><td>${inr(c.wcNwc)}</td></tr>
  <tr><td>Bank Finance (${s.wcBankPct}%)</td><td>${inr(c.wcBank)}</td></tr>
  </table>
  <p class="small muted">Applicable percentage / eligibility parameters can be changed under Settings rather than being hard-coded.</p>`;
}
function rRepayment(c){
  const yearRows = c.tlYearly.map((y,i)=>`<tr><td>Year ${i+1}</td><td>${inr(y.openBal)}</td><td>${inr(y.principal)}</td><td>${inr(y.interest)}</td><td>${inr(y.principal+y.interest)}</td><td>${inr(y.closeBal)}</td></tr>`).join('');
  return `<h3>Loan Repayment Schedule (Annual Summary)</h3>
  <table><tr><th>Year</th><th>Opening Balance</th><th>Principal Repayment</th><th>Interest</th><th>Total Debt Service</th><th>Closing Balance</th></tr>
  ${yearRows}</table>
  <p class="small muted">Term Loan: ${inr(c.termLoan)} @ ${current.loanTerms.interestRatePct}% p.a., tenure ${current.loanTerms.tenureYears} years,
  moratorium ${current.loanTerms.moratoriumMonths} months, equal-principal ${current.loanTerms.instalmentFreq.toLowerCase()} instalments.
  Working Capital is a revolving fund-based limit — interest is charged on utilisation and it is not repaid through this term schedule.</p>`;
}
function rRatios(c){
  const rows = [["Current Ratio","currentRatio",""],["Debt Equity Ratio","debtEquity",""],["TOL/TNW","tolTnw",""],

    ["Interest Coverage Ratio","interestCoverage",""],["Stock Holding Period","stockDays"," days"],
    ["Debtor Holding Period","debtorDays"," days"],["Creditor Holding Period","creditorDays"," days"],
    ["Working Capital Cycle","wcCycle"," days"]];
  const dscrRows = c.dscrYearly.map((d,i)=>`<tr><td>Year ${i+1}</td><td>${inr(d.cashAccrual)}</td><td>${inr(d.interest)}</td><td>${inr(d.principal)}</td><td>${inr(d.debtService)}</td><td>${d.dscr!==null?d.dscr.toFixed(2):'Not Applicable'}</td></tr>`).join('');

  <table><tr><th>Ratio</th><th>Yr 1</th><th>Yr 2</th><th>Yr 3</th></tr>
  ${rows.map(([label,k,suf])=>`<tr><td>${label}</td>${[0,1,2].map(i=>{const v=c.ratios[i][k]; return `<td>${v===null?'Not Applicable':(typeof v==='number'?(Number.isInteger(v)?v:v.toFixed(2)):v)+suf}</td>`;}).join('')}</tr>`).join('')}
  </table>
  <h3>DSCR</h3>
  <table><tr><th>Year</th><th>Cash Accrual</th><th>Interest</th><th>Principal Repayment</th><th>Total Debt Service</th><th>DSCR</th></tr>

}

  <tr><td>Fixed Cost</td><td>${inr(c.breakeven[0].fixed)}</td><td>${inr(c.breakeven[1].fixed)}</td><td>${inr(c.breakeven[2].fixed)}</td></tr>

  <tr><td>Break-even % of Projected Sales</td><td>${c.breakeven[0].bePct!==null?pct(c.breakeven[0].bePct,1):'Not Applicable'}</td><td>${c.breakeven[1].bePct!==null?pct(c.breakeven[1].bePct,1):'Not Applicable'}</td><td>${c.breakeven[2].bePct!==null?pct(c.breakeven[2].bePct,1):'Not Applicable'}</td></tr>
  </table>
  <p class="small muted">Fixed cost includes employee cost, rent, electricity, administrative expenses, repairs, other operating expenses, depreciation and interest. Variable cost includes cost of sales, transport and selling expenses. This is an indicative approximation based on the granularity of activity assumptions used.</p>`;
}
function rInterpretation(c){
  const s = c.sales;

  return `<h3>Financial Interpretation</h3>
  <p><b>Sales:</b> Sales are projected to move from ${inr(s[0])} to ${inr(s[1])} and ${inr(s[2])} over three years.</p>
  <p><b>Profitability:</b> The projected business ${profitable?'remains profitable':'shows losses in at least one projected year'} under the assumptions used, with EBITDA margins of ${pct(c.ratios[0].ebitdaMargin,1)}, ${pct(c.ratios[1].ebitdaMargin,1)} and ${pct(c.ratios[2].ebitdaMargin,1)}.</p>
  <p><b>Repayment:</b> Projected cash accrual and an average DSCR of ${c.avgDscr!==null?c.avgDscr.toFixed(2):'Not Applicable'} indicate the estimated debt-servicing capacity.</p>
  <p><b>Working Capital:</b> Working capital is assessed using the Turnover Method, cross-checked against the Operating Cycle Method.</p>
  <div class="note-box">The proposal is subject to verification, viability assessment and applicable lending norms.</div>`;
}

  const a = getAssumptions(current);

  return `<h3>Key Assumptions & Methodology</h3>
  <p>The financial projections have been prepared using the sales estimates provided by the borrower and the activity-specific assumptions selected in the application. The assumptions should be reviewed and modified wherever actual business information is available.</p>
  <table><tr><th>Parameter</th><th>Value</th></tr>
  ${ASSUMPTION_FIELDS.map(([k,label])=>`<tr><td>${label}</td><td>${a[k]}${k.includes('Days')?' days':'%'}</td></tr>`).join('')}
  <tr><td>Working Capital – Turnover Method</td><td>${s.wcTurnoverPct}% / ${s.wcNwcPct}% / ${s.wcBankPct}%</td></tr>
  <tr><td>Promoter Margin on Fixed Assets</td><td>${s.promoterMarginFixedPct}%</td></tr>
  <tr><td>Owner Drawings</td><td>${s.ownerDrawingsPct}% of Profit After Tax</td></tr>

}

  return `<h3>Conclusion</h3>
  <p>Based on the activity-specific assumptions and the sales projection provided, the proposed project for ${escapeHtml(current.borrower.business)}
